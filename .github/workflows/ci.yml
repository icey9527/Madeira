# port-ci — Madeira iOS 15.6 移植分支的云端编译冒烟
#
# 分支纪律（重要）:
#   * 本 workflow 只允许在 port/ios15.6 上运行（见 guard step）。
#   * main 保持与上游 willfaust/Madeira 同步的干净镜像，禁止拿来跑构建。
#   * 构建逻辑全部在 tools/ci/build-all.sh，本文件只做编排 —— 改构建请改脚本。
#   * workflow_dispatch 需要 workflow 文件存在于默认分支才会出现在 UI；
#     当前依赖 push 到 port/ios15.6 自动触发。
name: port-ci

on:
  push:
    branches: [port/ios15.6]
  workflow_dispatch:
    inputs:
      runner:
        description: Build host for timing comparison
        type: choice
        default: macos-26
        options:
          - macos-26-intel
          - macos-26

concurrency:
  group: port-ci-${{ github.ref }}
  cancel-in-progress: true

# nightly 预发布需要用默认 GITHUB_TOKEN 创建/删除 Release
permissions:
  contents: write

env:
  # app-only 快车道（Phase 2 迭代）: 跳过 FEX/Wine 编译，原生库空桩，
  # xcodebuild 只验证 Swift/ObjC 编译（仅预期未定义符号链接失败允许通过）。
  # Phase 4（原生栈降级）时把 APP_ONLY 改回 '0' 跑完整流水线，
  # 届时 nightly 预发布步骤会自动开始产出可安装的 IPA。
  APP_ONLY: '0'
  IPHONEOS_DEPLOYMENT_TARGET: '15.6'

jobs:
  build:
    name: Build smoke (Debug, unsigned)
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 子模块改为在 build-all.sh 里按需浅克隆（actions/checkout 的
          # 递归子模块是全量克隆，wine/FEX 的历史 + FEX 测试数据仓会把
          # macOS runner 本就紧张的磁盘吃光 —— 见 run #8 的 No space left）。
          submodules: false
          fetch-depth: 1

      - name: Guard — 只允许 port/ios15.6
        run: |
          case "$GITHUB_REF" in
            refs/heads/port/ios15.6) echo "分支正确: $GITHUB_REF" ;;
            *) echo "::error::CI 只允许在 port/ios15.6 分支运行（当前 $GITHUB_REF），不要拿原版分支跑构建"; exit 1 ;;
          esac

      - name: Record runner hardware
        run: |
          echo "Runner: ${{ inputs.runner || 'macos-26' }} ($RUNNER_ARCH)"
          uname -m
          sysctl hw.ncpu hw.memsize

      - name: Cache toolchains（llvm-mingw / gnutls / ffmpeg / freetype 产物）
        id: toolchains-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            build/freetype-ios/build
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
          key: toolchains-macos26-ios15.6-v3-${{ hashFiles('build/gnutls-ios/build.sh', 'build/ffmpeg/build.sh', 'build/freetype-ios/build.sh') }}
          restore-keys: toolchains-macos26-ios15.6-v3-

      - name: Cache ccache（FEX 编译缓存，key 稳定、靠 ccache 自身内容判断命中）
        id: ccache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macos26-v2-${{ runner.arch }}-${{ hashFiles('build/fex-ios/build.sh') }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos26-v2-${{ runner.arch }}-
            ${{ runner.arch == 'X64' && format('ccache-macos26-v1-{0}-', hashFiles('build/fex-ios/build.sh')) || 'ccache-macos26-ARM64-v1-' }}

      - name: Cache VC++ 运行时 DLL（12 个，内容静态，静态 key）
        if: env.APP_ONLY != '1'
        uses: actions/cache@v4
        with:
          path: app/Madeira/x86_64-vcruntime
          key: vcruntime-x64-v1

      - name: Record restored compilation cache contents
        id: ccache-before
        if: env.APP_ONLY != '1'
        run: echo "fingerprint=$(python3 tools/ci/cache-fingerprint.py ccache .ccache)" >> "$GITHUB_OUTPUT"

      - name: Resolve FEX 子模块 SHA
        id: fexsha
        run: echo "sha=$(git ls-tree HEAD FEX | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache FEX 子模块（工作树 + .git/modules 元数据，key=gitlink SHA）
        id: fex-source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            FEX
            .git/modules/FEX
          key: ${{ runner.arch == 'X64' && format('fex-submodule-{0}', steps.fexsha.outputs.sha) || format('fex-submodule-ARM64-{0}', steps.fexsha.outputs.sha) }}

      - name: Restore downloaded llvm-mingw
        id: mingw-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: llvm-mingw-20260421-macos-universal
          restore-keys: |
            llvm-mingw-20260421-X64
            llvm-mingw-20260421-ARM64

      - name: Restore Homebrew downloads
        id: brew-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-macos26-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brew-downloads-macos26-${{ runner.arch }}-

      - name: Record restored Homebrew downloads
        id: brew-before
        if: env.APP_ONLY != '1'
        run: echo "fingerprint=$(python3 tools/ci/cache-fingerprint.py downloads ~/Library/Caches/Homebrew/downloads)" >> "$GITHUB_OUTPUT"

      - name: deps（brew / llvm-mingw / VC++ 运行时 / freetype 源码）
        id: deps
        run: tools/ci/build-all.sh deps

      - name: Check Homebrew download changes
        id: brew-after
        if: success() && env.APP_ONLY != '1'
        run: echo "fingerprint=$(python3 tools/ci/cache-fingerprint.py downloads ~/Library/Caches/Homebrew/downloads)" >> "$GITHUB_OUTPUT"

      - name: Save Homebrew downloads before native build
        if: success() && env.APP_ONLY != '1' && steps.brew-before.outputs.fingerprint != steps.brew-after.outputs.fingerprint
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}

      - name: Save downloaded llvm-mingw before native build
        if: success() && env.APP_ONLY != '1' && steps.mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: llvm-mingw-20260421-macos-universal

      - name: toolchains（GnuTLS / FFmpeg / freetype）
        run: tools/ci/build-all.sh toolchains

      - name: Save completed dependencies before FEX and Wine
        if: success() && env.APP_ONLY != '1' && steps.toolchains-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            build/freetype-ios/build
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
          key: ${{ steps.toolchains-cache.outputs.cache-primary-key }}

      - name: Initialize FEX checkout before restoring build outputs
        run: git submodule update --init --depth 1 -- FEX

      - name: Restore FEX incremental build
        id: fex-build-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: FEX/build-ios
          key: fex-build-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.fexsha.outputs.sha }}-${{ hashFiles('build/fex-ios/build.sh') }}

      - name: Restore FEX WoW64 module build
        id: fex-wow64-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          # 32 位 CPU 后端（libwow64fex.dll → aarch64-windows/xtajit.dll）现在由
          # build/fex-wow64/build.sh 从 pinned FEX 源码构建，key 里带上 build-all.sh
          # 的哈希，补丁一改就必然重建。
          path: FEX/build-wow64
          key: fex-wow64-ios15.6-${{ runner.arch }}-${{ steps.fexsha.outputs.sha }}-${{ hashFiles('build/fex-wow64/build.sh', 'tools/ci/build-all.sh') }}

      - name: native（FEXCore）
        id: native
        run: tools/ci/build-all.sh native

      - name: Save FEX checkout before later stages
        if: success() && steps.fex-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            FEX
            .git/modules/FEX
          key: ${{ steps.fex-source-cache.outputs.cache-primary-key }}

      - name: Save completed FEX build before Wine
        if: success() && env.APP_ONLY != '1' && steps.fex-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-ios
          key: ${{ steps.fex-build-cache.outputs.cache-primary-key }}

      - name: Save FEX WoW64 module build
        if: success() && env.APP_ONLY != '1' && steps.fex-wow64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-wow64
          key: ${{ steps.fex-wow64-cache.outputs.cache-primary-key }}

      - name: Check compilation cache changes
        id: ccache-after
        if: success() && env.APP_ONLY != '1'
        run: echo "fingerprint=$(python3 tools/ci/cache-fingerprint.py ccache .ccache)" >> "$GITHUB_OUTPUT"

      - name: Save FEX compilation cache before Wine
        if: success() && env.APP_ONLY != '1' && steps.ccache-before.outputs.fingerprint != steps.ccache-after.outputs.fingerprint
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Resolve Wine build inputs
        id: wine-inputs
        if: env.APP_ONLY != '1'
        run: echo "key=$(python3 tools/ci/wine-cache-key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore completed Wine native libraries and generated headers
        id: wine-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
          key: wine-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ steps.wine-inputs.outputs.key }}

      - name: wine（configure + unix 侧静态库）
        id: wine
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: tools/ci/build-all.sh wine

      - name: Save completed Wine before later stages
        if: success() && env.APP_ONLY != '1' && steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
          key: ${{ steps.wine-cache.outputs.cache-primary-key }}

      # 32 位（WoW64）宿主 ntdll 必须和我们的原生层配套：上游那份成品假设
      # "原生层已经先分配 native TLS"，而 iOS 版 alloc_thread_tls 发生得更晚，
      # 于是 FEX 的 CPU 后端一初始化就读到 NULL（libwow64fex+0x1b2a88）。
      # build/wine-wow64/prepare.py 把 Wine 的 init_wow64 改成"先分配 TLS、
      # 再加载 CPU 后端"，并把 iOS unwind-stall 守卫从 3 步放宽到 4096 步
      # （32 位 C++ 抛出会在第 4 步自然结束，判早了会把伪进程直接拆掉）。
      - name: Restore native WoW64 loader build
        id: wow64-loader-cache
        if: env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: build/wine-wow64/output
          key: wow64-loader-v2-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ hashFiles('build/wine-wow64/build.sh', 'build/wine-wow64/prepare.py') }}

      - name: Build native WoW64 loader (aarch64-windows/ntdll.dll)
        if: env.APP_ONLY != '1'
        run: bash build/wine-wow64/build.sh > >(tee ci-logs/wine-wow64-loader.log) 2>&1

      - name: Save native WoW64 loader build
        if: success() && env.APP_ONLY != '1' && steps.wow64-loader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/wine-wow64/output
          key: ${{ steps.wow64-loader-cache.outputs.cache-primary-key }}

      - name: Resolve Rust version
        id: rust-version
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.deps.outcome == 'success' }}
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache pairing dependencies
        id: pairing-cache
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.deps.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build/rppairing-ios/target
          key: pairing-ios15.6-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ steps.deps.outputs.xcode }}-${{ hashFiles('build/rppairing-ios/**') }}

      - name: Pairing library（真实 iOS 静态库）
        id: pairing
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.deps.outcome == 'success' }}
        run: |
          rustup target add aarch64-apple-ios
          bash build/rppairing-ios/build.sh > >(tee ci-logs/rppairing.log) 2>&1

      - name: Save completed pairing before later stages
        if: ${{ !cancelled() && steps.pairing.outcome == 'success' && steps.pairing-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            build/rppairing-ios/target
          key: ${{ steps.pairing-cache.outputs.cache-primary-key }}

      - name: Restore iOS LLVM
        id: llvm-cache
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.deps.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: llvm15-macos26-${{ runner.arch }}-ios15.6-${{ hashFiles('build/llvm-ios/build.sh') }}-${{ steps.deps.outputs.xcode }}
          restore-keys: llvm15-macos26-${{ runner.arch }}-ios15.6-${{ hashFiles('build/llvm-ios/build.sh') }}

      - name: LLVM for DXMT（host tablegen + iOS shader libraries）
        id: llvm
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.deps.outcome == 'success' }}
        run: bash build/llvm-ios/build.sh > >(tee ci-logs/llvm-ios.log) 2>&1

      - name: Save completed iOS LLVM before DXMT
        if: ${{ !cancelled() && steps.llvm.outcome == 'success' && steps.llvm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Resolve DXMT SHA
        id: dxmtsha
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: echo "sha=$(git ls-tree HEAD dxmt | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      # Every file in build/dxmt-ios/ is an input to the archive, so the key takes
      # the whole directory.  Naming files one by one is how the probe's
      # airconv_probe.cpp / metal_probe.mm were left out: the cache kept returning
      # an archive built without them and CI stayed green.  (Nothing generated lives
      # at this level -- obj/, compat-src/ and the .a files are ignored and absent
      # on a fresh runner, so '**' sees exactly the checked-in sources.)
      - name: Restore completed DXMT
        id: dxmt-cache
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: dxmt-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.dxmtsha.outputs.sha }}-${{ steps.fexsha.outputs.sha }}-${{ hashFiles('build/dxmt-ios/**', 'build/llvm-ios/build.sh', 'build/madeira-d3d12/deps.sh', 'madeira-d3d12/src/**', 'madeira-d3d12/tests/native/msc_canary.mm', 'madeira-d3d12/third_party/metal-shader-converter/**', 'app/Madeira/d3d12/libmetalirconverter.dylib') }}

      - name: DXMT（真实图形静态库）
        id: dxmt
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' && steps.dxmt-cache.outputs.cache-hit != 'true' }}
        run: bash build/dxmt-ios/build.sh > >(tee ci-logs/dxmt.log) 2>&1

      - name: Save completed DXMT before App
        if: ${{ !cancelled() && steps.dxmt.outcome == 'success' && steps.dxmt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: ${{ steps.dxmt-cache.outputs.cache-primary-key }}

      # 32 位（i386）那一半也从 pinned wine 源码构建：C++ 异常是跨
      # "i386 DLL ↔ aarch64 宿主 ntdll" 传递的，两半必须同源。混着用的时候
      # （宿主 ntdll 自编 + i386 用上游成品）32 位抛出会带着一个退化上下文
      # （pc=0）进宿主 ntdll，处理函数搜索原地打转。
      - name: Restore 32-bit Windows runtime
        id: wow64-cache
        if: success() && env.APP_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/i386-windows
          key: wine-i386-v2-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ steps.dxmtsha.outputs.sha }}-${{ hashFiles('build/wine-i386/build.sh', 'tools/ci/verify-wow64.py') }}

      - name: Restore incremental 32-bit build
        id: wow64-build-cache
        if: success() && env.APP_ONLY != '1' && steps.wow64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            wine/build-i386
            dxmt/build-pe-i386
          key: wine-i386-build-v2-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ steps.dxmtsha.outputs.sha }}-${{ hashFiles('build/wine-i386/build.sh', 'tools/ci/verify-wow64.py') }}
          restore-keys: wine-i386-build-v2-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ steps.dxmtsha.outputs.sha }}-

      - name: Build 32-bit Windows runtime (Wine i386 + DXMT i386)
        id: wow64
        if: success() && env.APP_ONLY != '1' && steps.wow64-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix)/opt/bison/bin:$(brew --prefix)/opt/flex/bin:$PATH"
          brew install meson ninja
          bash build/wine-i386/build.sh > >(tee ci-logs/wine-i386.log) 2>&1
          python3 tools/ci/verify-wow64.py app/Madeira

      - name: Save incremental 32-bit build after failure
        if: ${{ !cancelled() && steps.wow64.outcome == 'failure' }}
        uses: actions/cache/save@v4
        with:
          path: |
            wine/build-i386
            dxmt/build-pe-i386
          key: ${{ steps.wow64-build-cache.outputs.cache-primary-key }}

      - name: Save completed 32-bit Windows runtime
        if: success() && env.APP_ONLY != '1' && steps.wow64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/i386-windows
          key: ${{ steps.wow64-cache.outputs.cache-primary-key }}

      - name: Verify 32-bit Windows runtime
        if: success() && env.APP_ONLY != '1'
        run: python3 tools/ci/verify-wow64.py app/Madeira

      # The app cache hands back a linked Madeira.debug.dylib, and restoring it
      # when the archives it was linked from have changed is how a fixed build
      # ships an old binary (that happened: the guard for MTLCopyAllDevices was
      # missing from an IPA that should have carried it).  Content-hash the
      # archives the link consumes and make them part of the key, so any change
      # there invalidates the prefix restore.
      - name: Fingerprint the staged native libraries (recorded, no longer in the key)
        id: native-fingerprint
        run: |
          sha="$(LC_ALL=C sha256sum app/Madeira/*.a | LC_ALL=C sha256sum | cut -d' ' -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "staged native libraries fingerprint: $sha"

      - name: Restore App incremental build
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            # Intermediates only: caching Build/Products would cache the linked
            # dylib and the copied bundles, which is exactly how a fixed binary
            # failed to ship once.  The compile products still come back, so the
            # link and the copy phases just run again -- that is the point.
            ci-DD/Madeira-DD/Build/Intermediates.noindex
            ci-DD/Madeira-DD/ModuleCache.noindex
            ci-DD/Madeira-DD/SDKStatCaches.noindex
          key: app-v2-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ env.APP_ONLY }}-${{ hashFiles('app/Madeira.xcodeproj/project.pbxproj', 'app/Madeira.xcodeproj/xcshareddata/xcschemes/**', 'app/Madeira/Info.plist', 'app/Madeira/Madeira.entitlements', 'tools/ci/build-all.sh', 'build/dxmt-pe/build.sh', 'build/dxmt-pe/prepare-meson.py', 'build/dxmt-pe/native-osx.txt', 'build/dxmt-pe/verify-metallib.py') }}-${{ steps.dxmtsha.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: app-v2-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ env.APP_ONLY }}-${{ hashFiles('app/Madeira.xcodeproj/project.pbxproj', 'app/Madeira.xcodeproj/xcshareddata/xcschemes/**', 'app/Madeira/Info.plist', 'app/Madeira/Madeira.entitlements', 'tools/ci/build-all.sh', 'build/dxmt-pe/build.sh', 'build/dxmt-pe/prepare-meson.py', 'build/dxmt-pe/native-osx.txt', 'build/dxmt-pe/verify-metallib.py') }}-${{ steps.dxmtsha.outputs.sha }}-

      - name: Verify committed upstream compatibility layers
        run: python3 tools/ci/verify-upstream-compat.py app/Madeira

      - name: Restore the rebuilt DXMT PE d3d11.dll
        id: dxmt-pe-cache
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          # Exact key only, no restore-keys: this DLL is shipped inside the IPA, and
          # a prefix hit could hand back one built from older sources.  A miss just
          # rebuilds, which is what every run did before this cache existed (the step
          # costs 2m09s of each build).
          path: app/Madeira/arm64ec-windows/d3d11.dll
          key: dxmt-pe-ios15.6-${{ runner.arch }}-${{ steps.deps.outputs.xcode }}-${{ steps.native.outputs.wine-sha }}-${{ steps.dxmtsha.outputs.sha }}-${{ hashFiles('build/dxmt-pe/build.sh', 'build/dxmt-pe/prepare-meson.py', 'build/dxmt-pe/native-osx.txt', 'build/dxmt-pe/verify-metallib.py', 'build/llvm-ios/build.sh') }}

      - name: DXMT PE（arm64ec d3d11.dll，内嵌库编成 iOS Metal）
        id: dxmt-pe
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' && steps.dxmt-pe-cache.outputs.cache-hit != 'true' }}
        run: bash build/dxmt-pe/build.sh > >(tee ci-logs/dxmt-pe.log) 2>&1

      - name: Save the rebuilt DXMT PE d3d11.dll
        if: ${{ !cancelled() && steps.dxmt-pe-cache.outputs.cache-hit != 'true' && steps.dxmt-pe.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/arm64ec-windows/d3d11.dll
          key: ${{ steps.dxmt-pe-cache.outputs.cache-primary-key }}

      - name: Verify the DXMT PE d3d11.dll (also on a cache hit)
        # The build script checks its own output, but a cache hit skips the build, so
        # check the restored file too.  The touch keeps the app stage copying this
        # DLL into the bundle even when DerivedData came back from the app cache.
        if: ${{ !cancelled() && env.APP_ONLY != '1' && steps.native.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          python3 build/dxmt-pe/verify-metallib.py app/Madeira/arm64ec-windows/d3d11.dll
          touch app/Madeira/arm64ec-windows/d3d11.dll

      - name: app（xcodebuild 编译冒烟）
        id: app
        run: tools/ci/build-all.sh app

      - name: Save App incremental build
        if: ${{ !cancelled() && (steps.app.outcome == 'success' || steps.app.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            # Intermediates only: caching Build/Products would cache the linked
            # dylib and the copied bundles, which is exactly how a fixed binary
            # failed to ship once.  The compile products still come back, so the
            # link and the copy phases just run again -- that is the point.
            ci-DD/Madeira-DD/Build/Intermediates.noindex
            ci-DD/Madeira-DD/ModuleCache.noindex
            ci-DD/Madeira-DD/SDKStatCaches.noindex
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - name: Package IPA（存在 Madeira.app 时才打包）
        if: success() && env.APP_ONLY != '1'
        run: |
          DD="$GITHUB_WORKSPACE/ci-DD/Madeira-DD"
          APP="$DD/Build/Products/Debug-iphoneos/Madeira.app"
          if [ -x "$APP/Madeira" ]; then
            # Upstream v0.1.3 structure, read off the shipped IPA: `Madeira` is
            # a thin launcher that loads `@rpath/Madeira.debug.dylib`, and the
            # launcher itself carries the app entitlements -- upstream's thin
            # `Madeira` holds increased-memory-limit + get-task-allow while
            # `Madeira.debug.dylib` has no entitlements blob at all.  Process
            # entitlements come from the main executable, so sign the nested
            # Mach-O first and put the entitlement set on the launcher.
            for nested in \
              "$APP/Madeira.debug.dylib" \
              "$APP/__preview.dylib" \
              "$APP/d3d12/libmetalirconverter.dylib" \
              "$APP/Frameworks/StikJIT.framework/StikJIT" \
              "$APP/PlugIns/MadeiraJITHelper.appex/MadeiraJITHelper" \
              "$APP/PlugIns/MadeiraJITHelper.appex/MadeiraJITHelper.debug.dylib" \
              "$APP/PlugIns/MadeiraJITHelper.appex/__preview.dylib"; do
              [ -e "$nested" ] || continue
              codesign --force --sign - --timestamp=none "$nested"
            done
            codesign --force --sign - --timestamp=none --generate-entitlement-der \
              --entitlements app/Madeira/Madeira.entitlements "$APP/Madeira"
            codesign --display --entitlements :- "$APP/Madeira" > ci-logs/nightly-main-entitlements.plist
            python3 - <<'PY'
          import plistlib
          from pathlib import Path
          actual = plistlib.loads(Path('ci-logs/nightly-main-entitlements.plist').read_bytes())
          expected = plistlib.loads(Path('app/Madeira/Madeira.entitlements').read_bytes())
          banned = {'dynamic-codesigning', 'com.apple.private.cs.debugger', 'com.apple.private.skip-library-validation'}
          if actual != expected or banned.intersection(actual):
              raise SystemExit('Unexpected or banned main executable entitlements')
          application_id = 'TROLLTROLL.com.willfaust.madeora'
          if actual.get('application-identifier') != application_id or actual.get('com.apple.developer.team-identifier') != 'TROLLTROLL' or actual.get('keychain-access-groups') != [application_id]:
              raise SystemExit('Missing or unexpected TrollStore Keychain identity')
          print('Packaged main executable entitlements verified')
          PY
            mkdir -p ipa/Payload
            ditto "$APP" ipa/Payload/Madeira.app
            (cd ipa && zip -qry Madeira-port-nightly-unsigned.ipa Payload)
            echo "IPA 大小: $(du -h ipa/Madeira-port-nightly-unsigned.ipa | cut -f1)"
          else
            echo "::error::没有成功链接的 Madeira 主二进制"
            exit 1
          fi

      - name: Upload IPA artifact
        if: success() && env.APP_ONLY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-app-build
          path: ipa/Madeira-port-nightly-unsigned.ipa
          if-no-files-found: ignore

      # nightly 预发布: 照 Verviewer 的模式（删旧 nightly → 建新预发布）。
      # 仅完整流水线（APP_ONLY=0）发布——app-only 构建链接的是空桩原生库，
      # 产物不可运行，发出去会误导人。Phase 4 完成后自动生效。
      - name: Delete old nightly release
        if: env.APP_ONLY != '1'
        uses: cb80/delrel@latest
        with:
          tag: nightly
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish nightly pre-release
        if: env.APP_ONLY != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Madeira iOS 15 移植 Nightly（自动构建）
          body: |
            ## 📦 下载 / Download

            - 👉 **[Madeira-port-nightly-unsigned.ipa](https://github.com/${{ github.repository }}/releases/download/nightly/Madeira-port-nightly-unsigned.ipa)**
            - 🧾 **[对应源码（浏览）/ Corresponding source (tree)](https://github.com/${{ github.repository }}/tree/${{ github.sha }})**
            - ⬇️ **[对应源码（tar.gz） / Corresponding source (tar.gz)](https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz)**

            **对应源码 / Corresponding source**

            This unsigned IPA is built from the commit above. That commit tree
            contains the complete corresponding source for the copyleft
            components it ships: Madeira Dock is vendored at `madeira-dock/`,
            the Wine and DXMT sources are pinned as submodules under `wine/` and
            `dxmt/`, the GPL/LGPL patches are in `build/`, and the build scripts
            here document how each binary was produced. The Windows compatibility
            DLLs are the unmodified upstream Madeira v0.1.3 binaries and their
            upstream source is the `willfaust/Madeira` v0.1.3 tree.

            ⚠️ **未签名 IPA**：需用 TrollStore / SideStore / AltStore / Sideloadly
            安装。当前优先验证 iPadOS 15.6 上的 UI 启动；游戏兼容性尚未验收。
            小探针已验证 TrollStore 的 Open with JIT 路径，主 App 的 JIT 路径仍需适配。

            | 信息 / Info | 详情 / Details |
            |---|---|
            | 🎯 目标系统 / Target | iPadOS 15.6+（移植版，尚待完整包真机验收） |
            | 🕐 构建时间 / Build time | ${{ github.event.head_commit.timestamp }} |
            | 📝 提交 / Commit | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

            ⚠️ 自动构建的夜间预览版，可能不稳定 / Automated nightly preview build.
          prerelease: true
          draft: false
          files: ipa/Madeira-port-nightly-unsigned.ipa

      - name: Collect native compiler diagnostics
        if: always()
        run: |
          while IFS= read -r diagnostic; do
            mkdir -p "ci-logs/native-diagnostics/$(dirname "$diagnostic")"
            cp "$diagnostic" "ci-logs/native-diagnostics/$diagnostic"
          done < <(find build wine -type f \( -name '*.err' -o -name 'err-*.txt' -o -name 'config.log' \) 2>/dev/null)

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore
